name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,all]"

      - name: Run Ruff (linting)
        run: |
          ruff check adaptive_framework/

      - name: Run Black (formatting check)
        run: |
          black --check adaptive_framework/

      - name: Run MyPy (type checking)
        run: |
          mypy adaptive_framework/ --ignore-missing-imports

      - name: Run Tests
        run: |
          pytest test_simple.py test_enhanced.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Verify CLI works
        run: |
          adaptive doctor

      - name: Verify imports
        run: |
          python -c "from adaptive_framework import create_framework, AdaptiveFramework; print('Imports OK')"

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: adaptive-framework:test
          load: true

      - name: Test Docker image
        run: |
          docker run --rm adaptive-framework:test adaptive doctor